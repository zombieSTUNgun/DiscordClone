<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameNews.YC</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Y</div>
      <h1>GameNews</h1>
      <nav>
        <button class="tab active" data-tab="top">top</button>
        <button class="tab" data-tab="new">new</button>
        <button class="tab" data-tab="ask">ask</button>
      </nav>
    </header>

    <main class="container">
      <section class="composer">
        <h2>Submit</h2>
        <form id="postForm">
          <label>Title <input id="title" required maxlength="90" /></label>
          <label>Game <input id="game" required maxlength="40" placeholder="e.g. Elden Ring" /></label>
          <label>Link <input id="url" type="url" placeholder="https://..." /></label>
          <label>Text (optional) <textarea id="text" rows="4" maxlength="500"></textarea></label>
          <button type="submit">submit</button>
        </form>
      </section>

      <section class="board">
        <div class="board-head">
          <input id="search" placeholder="search title, game, or text" />
          <span id="count"></span>
        </div>
        <ol id="posts"></ol>
      </section>
    </main>

    <template id="postTemplate">
      <li class="item">
        <button class="vote" title="upvote">▲</button>
        <div class="post-body">
          <div class="title-row">
            <a class="title" target="_blank" rel="noreferrer"></a>
            <span class="host"></span>
          </div>
          <p class="meta"></p>
          <p class="text"></p>
          <button class="toggle-comments" type="button"></button>
          <div class="comments hidden"></div>
          <form class="comment-form hidden">
            <input class="comment-input" maxlength="140" placeholder="add comment" required />
            <button type="submit">reply</button>
          </form>
        </div>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
